{% extends 'layouts/base.html' %}
{% load static %}
{% block content %}
<h2 class="mb-4">Вход в аккаунт</h2>

<form method="post">
    {% csrf_token %}
    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <div class="mb-3">
        <label for="username" class="form-label">Логин или email</label>
        <input type="text" class="form-control" id="username" name="username" value="{{ request.POST.username }}">
    </div>

    <div class="mb-3">
        <label for="password" class="form-label">Пароль</label>
        <input type="password" class="form-control" id="password" name="password">
    </div>

    <button type="submit" class="btn btn-success mb-3">Войти</button>

    <p class="mt-3">
        Нет аккаунта? <a href="{% url 'signup' %}" class="text-success">Зарегистрируйтесь</a>
    </p>
</form>
{% endblock %}
