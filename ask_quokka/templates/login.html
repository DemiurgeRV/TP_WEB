{% extends 'layouts/base.html' %}
{% load static %}
{% block content %}
<h2 class="mb-4">Вход в аккаунт</h2>

<form>
    <div class="mb-3">
        <label for="username" class="form-label">Логин или email</label>
        <input type="text" class="form-control is-invalid" id="username" name="username" placeholder="Ваш логин или email">
        <div class="invalid-feedback">
            Введите логин или email.
        </div>
    </div>

    <div class="mb-3">
        <label for="password" class="form-label">Пароль</label>
        <input type="password" class="form-control is-invalid" id="password" name="password" placeholder="Введите пароль">
        <div class="invalid-feedback">
            Введите пароль.
        </div>
    </div>

    <button type="submit" class="btn btn-success mb-3">Войти</button>

    <p class="mt-3">
        Нет аккаунта? <a href="{% url 'signup' %}" class="text-success">Зарегистрируйтесь</a>
    </p>
</form>
{% endblock %}
