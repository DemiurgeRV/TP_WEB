{% extends 'layouts/base.html' %}
{% load static %}
{% block content %}
<h2 class="mb-4">Регистрация</h2>
<form enctype="multipart/form-data">
    <div class="mb-3">
        <label for="username" class="form-label">Логин</label>
        <input type="text" class="form-control" id="username" name="username" maxlength="150" placeholder="Ваш логин">
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">Почта</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="example@mail.com">
    </div>

    <div class="mb-3">
        <label for="nickname" class="form-label">Никнейм</label>
        <input type="text" class="form-control" id="nickname" name="nickname" maxlength="150" placeholder="Отображаемое имя">
    </div>

    <div class="mb-3">
        <label for="password1" class="form-label">Пароль</label>
        <input type="password" class="form-control" id="password1" name="password1" placeholder="Введите пароль">
    </div>

    <div class="mb-3">
        <label for="password2" class="form-label">Подтверждение пароля</label>
        <input type="password" class="form-control" id="password2" name="password2" placeholder="Повторите пароль">
    </div>

    <div class="mb-4">
        <label for="avatar" class="form-label">Аватар</label>
        <input class="form-control" type="file" id="avatar" name="avatar" accept="image/*">
        <div class="form-text">Файл изображения (jpeg, png). Необязательно.</div>
    </div>

    <button type="submit" class="btn btn-success">Зарегистрироваться</button>

    <p class="mt-3">
        Уже есть аккаунт? <a href="{% url 'login' %}" class="text-success">Войти</a>
    </p>
</form>
{% endblock %}
