{% extends 'layouts/base.html' %}
{% load static %}
{% block content %}
<h2 class="mb-4">Настройки профиля</h2>

<form enctype="multipart/form-data">
    <div class="mb-3">
        <label for="username" class="form-label">Логин</label>
        <input type="text" class="form-control is-invalid" id="username" name="username" value="Snake98" disabled>
        <div class="form-text">Логин изменить нельзя.</div>
    </div>

    <div class="mb-3">
        <label for="nickname" class="form-label">Никнейм</label>
        <input type="text" class="form-control" id="nickname" name="nickname" value="Snake">
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">Почта</label>
        <input type="email" class="form-control is-invalid" id="email" name="email" value="snake@example.com">
        <div class="invalid-feedback">Введите корректный email.</div>
    </div>

    <div class="mb-3">
        <label for="avatar" class="form-label">Аватар</label>
        <div class="mb-2">
            <img src="{% static '/img/snake.jpg' %}" alt="avatar" class="rounded-circle" width="64" height="64">
        </div>
        <input class="form-control" type="file" id="avatar" name="avatar">
    </div>

    <div class="mb-3">
        <label for="password" class="form-label">Новый пароль</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Оставьте пустым, если не меняете">
    </div>

    <div class="mb-3">
        <label for="password_confirm" class="form-label">Подтверждение пароля</label>
        <input type="password" class="form-control" id="password_confirm" name="password_confirm" placeholder="Повторите новый пароль">
    </div>

    <button type="submit" class="btn btn-success mb-3">Сохранить изменения</button>
</form>
{% endblock %}
