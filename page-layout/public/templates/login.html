                    <form class="flex-grow-2" style="width: 400px;">
                        <h2 class="mb-4">Вход</h2>
                        <div class="mb-3">
                            <label for="username" class="form-label">Имя пользователя</label>
                            <input type="text" class="form-control is-invalid" id="username" name="username" maxlength="150" placeholder="Введите логин">
                            <div class="form-text">Введите ваш логин.</div>
                            <div class="invalid-feedback">Такого пользователя не существует.</div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="password" name="password" maxlength="50" placeholder="Введите пароль">
                            <div class="form-text">Минимум 8 символов.</div>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Войти</button>
